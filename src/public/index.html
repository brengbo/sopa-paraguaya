<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratorio de rebote</title>
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
  <style>
    html, body { margin: 0; background: #141824; color: #e8e8f0; font-family: system-ui, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 10px; }
    h1 { margin: 0; font-size: 1.4rem; }
    #estado { color: #aab; font-size: .95rem; }
    footer { color: #778; font-size: .8rem; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Laboratorio de rebote</h1>
    <div id="estado">Cargando Java en el navegador… la primera vez puede tardar unos segundos.</div>
    <div id="juego"></div>
    <footer>Hecho en Java · se ejecuta en el navegador con CheerpJ</footer>
  </main>
  <script type="module">
    try {
      await cheerpjInit({ version: 17 });
      cheerpjCreateDisplay(960, 680, document.getElementById("juego"));
      document.getElementById("estado").textContent = "Click para lanzar · ENTER para empezar";
      await cheerpjRunJar("/app/laboratorio-rebote.jar");
    } catch (e) {
      document.getElementById("estado").textContent = "No se pudo iniciar el juego: " + e;
    }
  </script>
</body>
</html>
