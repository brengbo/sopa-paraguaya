<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Laboratorio de rebote</title>
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
  <style>
    html, body { margin: 0; background: #141824; color: #e8e8f0; font-family: system-ui, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 10px; }
    h1 { margin: 0; font-size: 1.4rem; }
    #estado { color: #aab; font-size: .95rem; text-align: center; }
    footer { color: #778; font-size: .8rem; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Laboratorio de rebote</h1>
    <div id="estado">Iniciando Java… la primera vez puede tardar un minuto.</div>
    <div id="juego"></div>
    <footer>Hecho en Java · se ejecuta en el navegador con CheerpJ</footer>
  </main>
  <script type="module">
    const estado = document.getElementById("estado");
    const t0 = performance.now();
    const seg = () => ((performance.now() - t0) / 1000).toFixed(1) + " s";
    try {
      await cheerpjInit({ version: 17 });
      console.log("Java listo", seg());
      estado.textContent = "Java listo (" + seg() + "). Cargando el juego…";
      cheerpjCreateDisplay(960, 680, document.getElementById("juego"));
      const codigo = await cheerpjRunJar("/app/rebote-v2.jar");
      console.log("El programa devolvió el control, código:", codigo, seg());
      estado.textContent = "Click para lanzar · ENTER para empezar";
    } catch (e) {
      console.error("Error al iniciar:", e);
      estado.textContent = "No se pudo iniciar el juego: " + e;
    }
  </script>
</body>
</html>
